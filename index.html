<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TAP Roleplay — Sklep</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0b0f;
      color: #fff;
    }

    header {
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 7%;
      background: #111116;
      border-bottom: 1px solid #24242c;
    }

    .logo {
      font-size: 23px;
      font-weight: 900;
      color: #ff6a00;
    }

    nav {
      display: flex;
      gap: 25px;
    }

    nav a {
      color: #aaa;
      text-decoration: none;
    }

    nav a:hover {
      color: #ff6a00;
    }

    .login {
      background: #5865f2;
      color: white;
      padding: 11px 18px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
    }

    .hero {
      text-align: center;
      padding: 80px 20px 45px;
    }

    .hero h1 {
      font-size: 48px;
      margin: 0 0 15px;
    }

    .hero h1 span {
      color: #ff6a00;
    }

    .hero p {
      color: #999;
      font-size: 17px;
    }

    .account {
      margin: 20px auto;
      max-width: 900px;
      padding: 18px;
      background: #121218;
      border: 1px solid #25252d;
      border-radius: 12px;
      display: none;
    }

    .balance {
      color: #ff6a00;
      font-weight: bold;
    }

    .admin {
      display: none;
      margin-left: 10px;
      color: white;
      background: #ff6a00;
      padding: 9px 14px;
      border-radius: 7px;
      text-decoration: none;
    }

    .shop {
      max-width: 1100px;
      margin: 30px auto 100px;
      padding: 0 20px;
    }

    .shop h2 {
      text-align: center;
      margin-bottom: 30px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .product {
      background: #121218;
      border: 1px solid #292932;
      border-radius: 14px;
      padding: 25px;
      transition: .2s;
    }

    .product:hover {
      transform: translateY(-3px);
      border-color: #ff6a00;
    }

    .product h3 {
      margin-top: 0;
      font-size: 22px;
    }

    .product p {
      color: #999;
      min-height: 45px;
    }

    .price {
      font-size: 25px;
      font-weight: bold;
      color: #ff6a00;
      margin: 20px 0;
    }

    button {
      width: 100%;
      border: 0;
      padding: 12px;
      border-radius: 8px;
      background: #ff6a00;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #ff7b1a;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .uid-box {
      display: none;
      margin-top: 15px;
    }

    .uid-box input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #0b0b0f;
      color: white;
      margin-bottom: 10px;
    }

    .message {
      margin-top: 12px;
      color: #aaa;
      font-size: 14px;
    }

    footer {
      text-align: center;
      color: #666;
      padding: 30px;
      border-top: 1px solid #222;
    }
  </style>
</head>

<body>

<header>
  <div class="logo">TAP ROLEPLAY</div>

  <nav>
    <a href="/">Start</a>
    <a href="#sklep">Sklep</a>
    <a href="#kontakt">Kontakt</a>
  </nav>

  <a class="login" href="/login">Discord</a>
</header>

<section class="hero">
  <h1>Sklep <span>TAP Roleplay</span></h1>
  <p>Zakup dodatki do swojej rozgrywki.</p>
</section>

<div class="account" id="account">
  Zalogowany jako:
  <strong id="username"></strong>
  |
  Saldo:
  <span class="balance" id="balance">0 PLN</span>

  <a href="/admin" class="admin" id="adminButton">
    Panel administracyjny
  </a>
</div>

<section class="shop" id="sklep">
  <h2>Sklep</h2>

  <div class="products" id="products">
    Ładowanie produktów...
  </div>
</section>

<footer id="kontakt">
  TAP Roleplay © 2026
</footer>

<script>
  let loggedUser = null;

  async function loadAccount() {
    try {
      const response = await fetch("/me");

      if (!response.ok) {
        return;
      }

      const data = await response.json();

      if (!data.loggedIn) {
        return;
      }

      loggedUser = data;

      document.getElementById("account").style.display = "block";
      document.getElementById("username").textContent =
        data.username || data.global_name || data.discord_id;

      document.getElementById("balance").textContent =
        Number(data.balance || 0) + " PLN";

      if (data.isAdmin) {
        document.getElementById("adminButton").style.display = "inline-block";
      }

    } catch (error) {
      console.error(error);
    }
  }

  async function loadProducts() {
    const container = document.getElementById("products");

    try {
      const response = await fetch("/api/products");

      if (!response.ok) {
        throw new Error("Nie udało się pobrać produktów.");
      }

      const products = await response.json();

      if (!products.length) {
        container.innerHTML = "<p>Brak dostępnych produktów.</p>";
        return;
      }

      container.innerHTML = products.map(product => `
        <div class="product">
          <h3>${escapeHtml(product.name)}</h3>

          <p>
            ${escapeHtml(product.description || "")}
          </p>

          <div class="price">
            ${Number(product.price)} PLN
          </div>

          ${
            product.type === "unban"
            ? `
              <div class="uid-box" id="uid-box-${product.id}">
                <input
                  id="uid-${product.id}"
                  type="number"
                  placeholder="Wpisz UID gracza"
                  min="1"
                >

                <button onclick="buyUnban(${product.id})">
                  Potwierdź zakup
                </button>

                <div class="message" id="message-${product.id}"></div>
              </div>

              <button
                id="buy-button-${product.id}"
                onclick="showUidBox(${product.id})"
              >
                Kup unbana
              </button>
            `
            : `
              <button onclick="buyProduct(${product.id})">
                Kup
              </button>
            `
          }
        </div>
      `).join("");

    } catch (error) {
      container.innerHTML =
        "<p>Nie udało się załadować produktów.</p>";

      console.error(error);
    }
  }

  function showUidBox(productId) {
    if (!loggedUser) {
      alert("Najpierw zaloguj się przez Discord.");
      window.location.href = "/login";
      return;
    }

    document.getElementById(
      "uid-box-" + productId
    ).style.display = "block";

    document.getElementById(
      "buy-button-" + productId
    ).style.display = "none";
  }

  async function buyUnban(productId) {
    if (!loggedUser) {
      alert("Najpierw zaloguj się przez Discord.");
      return;
    }

    const input = document.getElementById("uid-" + productId);
    const message = document.getElementById("message-" + productId);
    const button = input.parentElement.querySelector("button");

    const uid = Number(input.value);

    if (!Number.isInteger(uid) || uid <= 0) {
      message.textContent = "Wpisz poprawny UID.";
      return;
    }

    button.disabled = true;
    message.textContent = "Przetwarzanie zakupu...";

    try {
      const response = await fetch("/api/purchase", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          product_id: productId,
          uid: uid
        })
      });

      const data = await response.json();

      if (!response.ok) {
        message.textContent =
          data.error || "Nie udało się wykonać zakupu.";

        button.disabled = false;
        return;
      }

      message.textContent =
        "Zakup zakończony. Bot Discord wysłał komendę unbana.";

      document.getElementById("balance").textContent =
        Number(data.balance) + " PLN";

    } catch (error) {
      console.error(error);

      message.textContent =
        "Wystąpił błąd podczas zakupu.";

      button.disabled = false;
    }
  }

  async function buyProduct(productId) {
    if (!loggedUser) {
      alert("Najpierw zaloguj się przez Discord.");
      window.location.href = "/login";
      return;
    }

    alert("Ten produkt nie jest jeszcze skonfigurowany do zakupu.");
  }

  function escapeHtml(value) {
    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  loadAccount();
  loadProducts();
</script>

</body>
</html>
