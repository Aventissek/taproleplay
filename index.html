<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TAP Roleplay — Sklep</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0b0f;
      color: #fff;
    }

    header {
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 7%;
      background: #111116;
      border-bottom: 1px solid #24242c;
    }

    .logo {
      font-size: 23px;
      font-weight: 900;
      color: #ff6a00;
    }

    nav {
      display: flex;
      gap: 25px;
    }

    nav a {
      color: #aaa;
      text-decoration: none;
    }

    nav a:hover {
      color: #ff6a00;
    }

    .login {
      background: #5865f2;
      color: white;
      padding: 11px 18px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
    }

    .hero {
      text-align: center;
      padding: 80px 20px 45px;
    }

    .hero h1 {
      font-size: 48px;
      margin: 0 0 15px;
    }

    .hero h1 span {
      color: #ff6a00;
    }

    .hero p {
      color: #999;
      font-size: 17px;
    }

    .account {
      margin: 20px auto;
      max-width: 900px;
      padding: 18px;
      background: #121218;
      border: 1px solid #25252d;
      border-radius: 12px;
      display: none;
    }

    .balance {
      color: #ff6a00;
      font-weight: bold;
    }

    .admin {
      display: none;
      margin-left: 10px;
      color: white;
      background: #ff6a00;
      padding: 9px 14px;
      border-radius: 7px;
      text-decoration: none;
    }

    .shop {
      max-width: 1100px;
      margin: 30px auto 100px;
      padding: 0 20px;
    }

    .shop h2 {
      text-align: center;
      margin-bottom: 30px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .product {
      background: #121218;
      border: 1px solid #292932;
      border-radius: 14px;
      padding: 25px;
      transition: .2s;
    }

    .product:hover {
      transform: translateY(-3px);
      border-color: #ff6a00;
    }

    .product h3 {
      margin-top: 0;
      font-size: 22px;
    }

    .product p {
      color: #999;
      min-height: 45px;
    }

    .price {
      font-size: 25px;
      font-weight: bold;
      color: #ff6a00;
      margin: 20px 0;
    }

    button {
      width: 100%;
      border: 0;
      padding: 12px;
      border-radius: 8px;
      background: #ff6a00;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #ff7b1a;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .uid-box {
      display: none;
      margin-top: 15px;
    }

    .uid-box input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #0b0b0f;
      color: white;
      margin-bottom: 10px;
      outline: none;
    }

    .uid-box input:focus {
      border-color: #ff6a00;
    }

    .message {
      margin-top: 12px;
      color: #aaa;
      font-size: 14px;
    }

    .success {
      color: #4ade80;
    }

    .error {
      color: #ff6b6b;
    }

    footer {
      text-align: center;
      color: #666;
      padding: 30px;
      border-top: 1px solid #222;
    }

    @media (max-width: 700px) {
      header {
        padding: 0 20px;
      }

      nav {
        display: none;
      }

      .hero h1 {
        font-size: 36px;
      }

      .account {
        margin-left: 20px;
        margin-right: 20px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">TAP ROLEPLAY</div>

  <nav>
    <a href="/">Start</a>
    <a href="#sklep">Sklep</a>
    <a href="#kontakt">Kontakt</a>
  </nav>

  <a class="login" href="/login">Discord</a>
</header>

<section class="hero">
  <h1>Sklep <span>TAP Roleplay</span></h1>
  <p>Zakup dodatki do swojej rozgrywki.</p>
</section>

<div class="account" id="account">
  Zalogowany jako:
  <strong id="username"></strong>
  |
  Saldo:
  <span class="balance" id="balance">0 PLN</span>

  <a href="/admin" class="admin" id="adminButton">
    Panel administracyjny
  </a>
</div>

<section class="shop" id="sklep">
  <h2>Sklep</h2>

  <div class="products" id="products">
    Ładowanie produktów...
  </div>
</section>

<footer id="kontakt">
  TAP Roleplay © 2026
</footer>

<script>
  let loggedUser = null;

  // =========================
  // KONTO
  // =========================

  async function loadAccount() {
    try {
      const response = await fetch("/me", {
        cache: "no-store"
      });

      if (!response.ok) {
        return;
      }

      const data = await response.json();

      if (!data.loggedIn) {
        return;
      }

      loggedUser = data;

      document.getElementById("account").style.display = "block";

      document.getElementById("username").textContent =
        data.username ||
        data.global_name ||
        data.discord_id ||
        "Użytkownik";

      document.getElementById("balance").textContent =
        Number(data.balance || 0) + " PLN";

      if (data.isAdmin) {
        document.getElementById("adminButton").style.display =
          "inline-block";
      }

    } catch (error) {
      console.error("Błąd konta:", error);
    }
  }


  // =========================
  // PRODUKTY
  // =========================

  async function loadProducts() {
    const container = document.getElementById("products");

    container.innerHTML = "Ładowanie produktów...";

    try {
      const response = await fetch("/api/products", {
        cache: "no-store"
      });

      if (!response.ok) {
        throw new Error(
          "API zwróciło błąd HTTP " + response.status
        );
      }

      const data = await response.json();

      /*
        Worker zwraca:

        {
          "products": [
            {
              "id": 2,
              "name": "Unban",
              "price": 10,
              "type": "unban"
            }
          ]
        }

        Dlatego pobieramy data.products.
      */

      const products = Array.isArray(data)
        ? data
        : Array.isArray(data.products)
          ? data.products
          : [];

      if (products.length === 0) {
        container.innerHTML =
          "<p>Brak dostępnych produktów.</p>";
        return;
      }

      container.innerHTML = products.map(product => {

        const productId = Number(product.id);
        const productName = escapeHtml(product.name || "Produkt");
        const productDescription =
          escapeHtml(product.description || "");

        const productPrice =
          Number(product.price || 0);

        if (product.type === "unban") {

          return `
            <div class="product">

              <h3>${productName}</h3>

              <p>
                ${productDescription}
              </p>

              <div class="price">
                ${productPrice} PLN
              </div>

              <div
                class="uid-box"
                id="uid-box-${productId}"
              >

                <input
                  id="uid-${productId}"
                  type="number"
                  placeholder="Wpisz UID gracza"
                  min="1"
                  step="1"
                >

                <button
                  id="confirm-button-${productId}"
                  onclick="buyUnban(${productId})"
                >
                  Potwierdź zakup
                </button>

                <div
                  class="message"
                  id="message-${productId}"
                ></div>

              </div>

              <button
                id="buy-button-${productId}"
                onclick="showUidBox(${productId})"
              >
                Kup unbana
              </button>

            </div>
          `;

        }

        return `
          <div class="product">

            <h3>${productName}</h3>

            <p>
              ${productDescription}
            </p>

            <div class="price">
              ${productPrice} PLN
            </div>

            <button
              onclick="buyProduct(${productId})"
            >
              Kup
            </button>

          </div>
        `;

      }).join("");

    } catch (error) {

      console.error("Błąd produktów:", error);

      container.innerHTML = `
        <p class="error">
          Nie udało się załadować produktów.
        </p>
      `;
    }
  }


  // =========================
  // POKAZANIE UID
  // =========================

  function showUidBox(productId) {

    if (!loggedUser) {
      alert("Najpierw zaloguj się przez Discord.");
      window.location.href = "/login";
      return;
    }

    const uidBox =
      document.getElementById("uid-box-" + productId);

    const buyButton =
      document.getElementById("buy-button-" + productId);

    if (!uidBox || !buyButton) {
      return;
    }

    uidBox.style.display = "block";
    buyButton.style.display = "none";

    const input =
      document.getElementById("uid-" + productId);

    if (input) {
      input.focus();
    }
  }


  // =========================
  // KUPNO UNBANA
  // =========================

  async function buyUnban(productId) {

    if (!loggedUser) {
      alert("Najpierw zaloguj się przez Discord.");
      window.location.href = "/login";
      return;
    }

    const input =
      document.getElementById("uid-" + productId);

    const message =
      document.getElementById("message-" + productId);

    const button =
      document.getElementById("confirm-button-" + productId);

    if (!input || !message || !button) {
      return;
    }

    const uid = Number(input.value);

    // Sprawdzenie UID
    if (!Number.isInteger(uid) || uid <= 0) {

      message.className = "message error";
      message.textContent =
        "Wpisz poprawny UID gracza.";

      return;
    }

    button.disabled = true;

    message.className = "message";
    message.textContent =
      "Przetwarzanie zakupu...";

    try {

      const response = await fetch("/api/purchase", {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          product_id: productId,
          uid: uid
        })
      });

      const data = await response.json();

      if (!response.ok) {

        message.className = "message error";

        message.textContent =
          data.error ||
          data.message ||
          "Nie udało się wykonać zakupu.";

        button.disabled = false;

        return;
      }

      // Aktualizacja salda
      if (typeof data.balance !== "undefined") {

        document.getElementById("balance").textContent =
          Number(data.balance) + " PLN";
      }

      message.className = "message success";

      message.textContent =
        "Zakup zakończony. Komenda unbana została wysłana.";

      input.disabled = true;
      button.disabled = true;

    } catch (error) {

      console.error("Błąd zakupu:", error);

      message.className = "message error";

      message.textContent =
        "Wystąpił błąd podczas zakupu.";

      button.disabled = false;
    }
  }


  // =========================
  // INNE PRODUKTY
  // =========================

  async function buyProduct(productId) {

    if (!loggedUser) {
      alert("Najpierw zaloguj się przez Discord.");
      window.location.href = "/login";
      return;
    }

    alert(
      "Ten produkt nie jest jeszcze skonfigurowany do zakupu."
    );
  }


  // =========================
  // BEZPIECZNE HTML
  // =========================

  function escapeHtml(value) {

    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }


  // =========================
  // START
  // =========================

  loadAccount();
  loadProducts();

</script>

</body>
</html>
